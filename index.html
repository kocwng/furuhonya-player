<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ruang Nonton</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: pemutar di kiri, daftar bisa discroll di kanan; daftar turun ke bawah di layar sempit. Dua koleksi lewat tab. */
:root{--bg:#eef3f8;--panel:#fff;--line:#d6e0ea;--fg:#1d2a38;--muted:#5d6f82;--accent:#d9527a;--accent-ink:#fff;--watched:#2f9e77;--active:#fde6ed;
--font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;--font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12171e;--panel:#1b232d;--line:#2c3846;--fg:#e6edf5;--muted:#93a4b7;--accent:#ee7a9c;--accent-ink:#2a0f19;--watched:#5ccaa0;--active:#3a2230;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:16px 24px;grid-template-columns:minmax(0,1fr) 380px;align-items:start}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;justify-content:space-between}
h1{margin:0;font:700 26px/1.2 var(--font-display)}
.cols{display:flex;gap:6px;flex-wrap:wrap}
.cols button{padding:7px 16px}.cols button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sub{color:var(--muted);font-size:13px}
.stage{min-width:0;display:grid;gap:12px;position:sticky;top:12px}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;display:grid;place-items:center}
.frame video,.frame #ytbox,.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.ph{color:#9aa7b5;font-size:14px;padding:16px;text-align:center}
.now{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.now h2{margin:0;font:700 19px/1.3 var(--font-display);flex:1 1 280px;min-width:0}
.now small{color:var(--muted);font-size:13px;display:block;font-family:var(--font-body);font-weight:400}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.tog,select,input[type=search]{font:600 14px var(--font-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,.item:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tog{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.tog input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.tog select{border:0;padding:2px 4px;background:transparent}
.status{min-height:20px;color:var(--muted);font-size:13px}.status a{color:var(--accent)}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 40px);min-height:360px}
.ahead{padding:12px 14px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.arow{display:flex;justify-content:space-between;gap:8px;align-items:center}
.arow strong{font:700 15px var(--font-display)}.arow span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.ahead input[type=search]{width:100%;font-weight:400}
.tabs{display:flex;gap:6px}.tabs button{padding:6px 12px;font-size:13px}.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bar{height:4px;background:var(--line)}.bar i{display:block;height:100%;width:0;background:var(--watched);transition:width .3s}
ol{list-style:none;margin:0;padding:6px;overflow:auto}
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;cursor:pointer}
.item:hover{background:color-mix(in srgb,var(--line) 45%,transparent)}.item.on{background:var(--active)}
.item input{accent-color:var(--watched);width:18px;height:18px;margin:2px 0 0;flex:none;cursor:pointer}
.item .t{flex:1;min-width:0;font-weight:500;line-height:1.35}
.item.done .t{color:var(--muted)}
.item .pl{font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.gate{min-height:70vh;display:grid;place-items:center}
.gbox{width:min(360px,100%);display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
.gbox h1{font-size:24px}
.gbox input[type=password]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}.stage{position:static}aside{max-height:none}ol{max-height:60vh}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head><body>
<section id="gate" class="gate">
  <form id="gateform" class="gbox" autocomplete="off">
    <h1>Ruang Nonton</h1>
    <p class="sub" style="margin:0">Halaman ini dikunci. Masukkan key untuk membuka.</p>
    <label for="key" class="sr">Key</label>
    <input id="key" type="password" placeholder="Key" required autofocus>
    <label class="tog" for="remember"><input id="remember" type="checkbox"> Ingat di perangkat ini</label>
    <button id="go" type="submit" class="primary">Buka</button>
    <div id="err" class="status" role="alert"></div>
  </form>
</section>

<div id="app" hidden>
<div class="wrap">
  <header>
    <div class="cols" id="cols" role="tablist"></div>
    <div class="ctrl"><span class="sub" id="sub"></span><button id="lock" type="button">Kunci</button></div>
  </header>
  <main class="stage">
    <div class="frame">
      <div class="ph" id="ph">Pilih video di daftar untuk mulai.</div>
      <video id="vid" controls playsinline preload="metadata" hidden></video>
      <div id="ytbox" hidden></div>
    </div>
    <div class="now">
      <h2 id="title">Belum ada video dipilih<small id="pos"></small></h2>
      <div class="ctrl">
        <button id="prev" type="button">Sebelumnya</button>
        <button id="next" type="button" class="primary">Berikutnya</button>
        <label class="tog" for="auto"><input id="auto" type="checkbox" checked> Putar otomatis</label>
        <label class="tog" for="q" id="qwrap">Kualitas <select id="q"><option value="mp4-mobile">360p (hemat)</option><option value="mp4">720p</option></select></label>
      </div>
    </div>
    <div class="status" id="status" role="status"></div>
  </main>
  <aside aria-label="Daftar video">
    <div class="ahead">
      <div class="arow"><strong id="aname">Daftar</strong><span id="count"></span></div>
      <input id="search" type="search" placeholder="Cari judul…" aria-label="Cari video">
      <div class="arow"><select id="sort" aria-label="Urutan"><option value="asc">Urutan awal → akhir</option><option value="desc">Urutan akhir → awal</option></select>
      <div class="tabs"><button id="tabA" type="button" class="on">Belum</button><button id="tabW" type="button">Sudah</button></div></div>
    </div>
    <div class="bar"><i id="fill"></i></div>
    <ol id="list"></ol>
  </aside>
</div>
</div>

<script>
function start(DATA){
const $=id=>document.getElementById(id);
const rd=(k,d)=>{try{const x=JSON.parse(localStorage.getItem(k));return x==null?d:x}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const COL={
  furu:{name:'Furuhonya Kani',prov:'sm',items:DATA.furu.map(([l,id],i)=>({id,label:'Bagian '+l,ord:i}))},
  maruko:{name:'Maruko',prov:'yt',items:DATA.maruko.map(x=>({id:x.id,label:x.t,ord:x.n==null?1e9:x.n}))}
};
const KEYS=Object.keys(COL);
let pref=Object.assign({col:'furu',auto:true,q:'mp4-mobile',sort:'asc'},rd('hub-pref-v1',{}));
if(!COL[pref.col]) pref.col='furu';
const S={}; for(const k of KEYS) S[k]=Object.assign({watched:[],cur:null,pos:{}},rd('hub-'+k+'-v1',{}));
const savePref=()=>wr('hub-pref-v1',pref), saveS=()=>wr('hub-'+pref.col+'-v1',S[pref.col]);
let view='active', seq=0, errStreak=0, yt=null, ytApi=0 /*0 belum,1 memuat,2 siap*/, ytWait=[];
const vid=$('vid'), ytbox=$('ytbox'), ph=$('ph');
const col=()=>COL[pref.col], st=()=>S[pref.col];
const watched=()=>new Set(st().watched);
const byId=()=>Object.fromEntries(col().items.map(v=>[v.id,v]));
const setStatus=t=>{$('status').textContent=t};

function ordered(list){ const r=list.slice().sort((a,b)=>a.ord-b.ord); if(pref.sort==='desc') r.reverse(); return r; }
function rows(){
  const q=$('search').value.trim().toLowerCase(), w=watched();
  return ordered(col().items.filter(v=>v.label.toLowerCase().includes(q)&&(view==='watched'?w.has(v.id):!w.has(v.id))));
}
function nextOf(id,dir){                       // berikutnya di daftar yang belum ditonton
  const q=$('search').value.trim().toLowerCase(), w=watched();
  const r=ordered(col().items.filter(v=>v.label.toLowerCase().includes(q)&&(!w.has(v.id)||v.id===id)));
  const i=r.findIndex(v=>v.id===id); return r[i+dir]||null;
}
function render(){
  const r=rows(), list=$('list'), w=watched(), cur=st().cur; list.replaceChildren();
  if(!r.length) list.innerHTML='<li class="empty">'+(view==='watched'?'Belum ada yang ditandai sudah ditonton.':'Semua sudah ditonton, atau tidak ada yang cocok.')+'</li>';
  const frag=document.createDocumentFragment();
  for(const v of r){
    const li=document.createElement('li'), done=w.has(v.id);
    li.className='item'+(v.id===cur?' on':'')+(done?' done':''); li.tabIndex=0; li.dataset.id=v.id;
    li.innerHTML='<input type="checkbox" aria-label="Sudah ditonton"'+(done?' checked':'')+'><span class="t"></span>'+(v.id===cur?'<span class="pl">Diputar</span>':'');
    li.querySelector('.t').textContent=v.label; frag.appendChild(li);
  }
  list.appendChild(frag);
  const n=col().items.filter(v=>w.has(v.id)).length, total=col().items.length;
  $('count').textContent=n+' / '+total+' ditonton';
  $('fill').style.width=(n/total*100)+'%';
  $('aname').textContent=col().name;
  $('sub').textContent=total+' video';
  const on=list.querySelector('.item.on'); if(on) on.scrollIntoView({block:'nearest'});
}
function show(id){
  const v=byId()[id]; if(!v) return;
  $('title').firstChild.textContent=v.label;
  const idx=ordered(col().items).findIndex(x=>x.id===id)+1;
  $('pos').textContent=idx+' dari '+col().items.length;
  $('prev').disabled=!nextOf(id,-1); render();
}

/* --- pemutar: hanya satu aktif; yang lain dilepas dari memori --- */
function releaseSM(){ vid.pause(); vid.removeAttribute('src'); vid.load(); vid.hidden=true; }
function releaseYT(){ if(yt){ try{yt.destroy()}catch(e){} yt=null } ytbox.replaceChildren(); ytbox.hidden=true; }
function releaseAll(){ seq++; releaseSM(); releaseYT(); ph.hidden=false; }
async function smUrl(id){
  const r=await fetch('https://api.streamable.com/videos/'+id); if(!r.ok) throw new Error('api '+r.status);
  const f=(await r.json()).files||{}; const p=f[pref.q]||f['mp4-mobile']||f.mp4||f['mp4-high']||f.original;
  if(!p||!p.url) throw new Error('no file'); return p.url.startsWith('//')?'https:'+p.url:p.url;
}
async function playSM(id,t){
  const my=++seq; releaseYT(); ph.hidden=true; vid.hidden=false; vid.pause(); vid.removeAttribute('src'); vid.load();
  try{
    const url=await smUrl(id); if(my!==seq) return;
    vid.src=url;
    if(t>5) vid.addEventListener('loadedmetadata',()=>{ if(my===seq&&t<vid.duration-10) vid.currentTime=t },{once:true});
    setStatus(pref.auto?'Akan lanjut otomatis setelah video selesai.':'');
    vid.play().catch(()=>setStatus('Tekan tombol putar untuk mulai.'));
  }catch(e){ if(my===seq) setStatus('Video gagal dimuat. Coba bagian lain atau muat ulang halaman.') }
}
function loadYTApi(cb){
  if(ytApi===2) return cb(); ytWait.push(cb); if(ytApi===1) return; ytApi=1;
  window.onYouTubeIframeAPIReady=()=>{ ytApi=2; ytWait.splice(0).forEach(f=>f()) };
  const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; s.onerror=()=>{ytApi=0;setStatus('Pemutar YouTube gagal dimuat. Periksa koneksi internet.')}; document.head.appendChild(s);
}
function playYT(id,t){
  const my=++seq; releaseSM(); ph.hidden=true; ytbox.hidden=false;
  setStatus('Memuat video…');
  loadYTApi(()=>{
    if(my!==seq) return;
    const startSeconds=t>5?t:0;
    if(yt&&yt.loadVideoById){ yt.loadVideoById({videoId:id,startSeconds}); return }
    ytbox.innerHTML='<div id="yt"></div>';
    const vars={rel:0,playsinline:1,autoplay:1,start:startSeconds}; if(location.protocol.startsWith('http')) vars.origin=location.origin;
    yt=new YT.Player('yt',{width:'100%',height:'100%',videoId:id,playerVars:vars,events:{
      onStateChange(e){
        if(e.data===1){errStreak=0;setStatus(pref.auto?'Akan lanjut otomatis setelah video selesai.':'')}
        if(e.data===0) onEnded();
      },
      onError(e){ onError('kode '+e.data) }}});
  });
}
function play(id,t){
  const s=st(); s.cur=id; saveS(); show(id);
  const start=t===undefined?(s.pos[id]||0):t;
  if(col().prov==='sm') playSM(id,start); else playYT(id,start);
}
function onEnded(){
  const s=st(), cur=s.cur; if(!cur) return;
  if(!s.watched.includes(cur)) s.watched.push(cur); delete s.pos[cur]; saveS();
  const n=nextOf(cur,1);
  if(pref.auto&&n){ setStatus('Lanjut ke berikutnya…'); play(n.id,0) } else { render(); setStatus(n?'Selesai.':'Semua video di daftar ini sudah selesai.') }
}
function onError(why){
  const cur=st().cur, n=nextOf(cur,1); errStreak++;
  const el=$('status'); el.textContent='Video ini tidak bisa diputar di sini ('+why+'). ';
  if(pref.auto&&n&&errStreak<5){ el.append('Melewati…'); setTimeout(()=>{ if(st().cur===cur) play(n.id,0) },1500) }
  else if(col().prov==='yt'){ const a=document.createElement('a'); a.href='https://www.youtube.com/watch?v='+cur; a.target='_blank'; a.rel='noopener noreferrer'; a.textContent='Buka di YouTube ↗'; el.append(a) }
}
vid.addEventListener('ended',onEnded);
vid.addEventListener('error',()=>{ if(vid.getAttribute('src')) onError('error pemutar') });
setInterval(()=>{                              // simpan posisi tiap 5 detik
  const s=st(), cur=s.cur; if(!cur) return; let t=0;
  if(col().prov==='sm'){ if(!vid.paused&&!vid.hidden) t=vid.currentTime }
  else if(yt&&yt.getPlayerState&&yt.getPlayerState()===1) t=yt.getCurrentTime();
  if(t>1){ s.pos[cur]=Math.floor(t); saveS() }
},5000);

/* --- UI --- */
function mark(id,v){ const s=st(), has=s.watched.includes(id); if(v&&!has) s.watched.push(id); if(!v&&has) s.watched=s.watched.filter(x=>x!==id); saveS(); render(); }
$('list').addEventListener('click',e=>{
  const li=e.target.closest('.item'); if(!li) return; const id=li.dataset.id;
  if(e.target.matches('input')){ mark(id,e.target.checked); return }
  play(id);
});
$('list').addEventListener('keydown',e=>{ const li=e.target.closest('.item'); if(li&&!e.target.matches('input')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();play(li.dataset.id)} });
$('next').onclick=()=>{ const cur=st().cur; if(cur) mark(cur,true); const n=(cur&&nextOf(cur,1))||rows()[0]; if(n) play(n.id,0); };
$('prev').onclick=()=>{ const p=nextOf(st().cur,-1); if(p) play(p.id) };
$('auto').checked=!!pref.auto; $('auto').onchange=e=>{pref.auto=e.target.checked;savePref()};
$('sort').value=pref.sort; $('sort').onchange=e=>{pref.sort=e.target.value;savePref();render()};
$('q').value=pref.q; $('q').onchange=e=>{ pref.q=e.target.value; savePref(); const s=st(); if(col().prov==='sm'&&s.cur){ s.pos[s.cur]=Math.floor(vid.currentTime||0); saveS(); play(s.cur) } };
$('search').addEventListener('input',render);
function setView(x){view=x;$('tabA').classList.toggle('on',x==='active');$('tabW').classList.toggle('on',x==='watched');render()}
$('tabA').onclick=()=>setView('active'); $('tabW').onclick=()=>setView('watched');
function useCol(k){
  releaseAll(); pref.col=k; savePref(); errStreak=0; view='active'; $('search').value='';
  $('tabA').classList.add('on'); $('tabW').classList.remove('on');
  document.querySelectorAll('#cols button').forEach(b=>{b.classList.toggle('on',b.dataset.k===k);b.setAttribute('aria-selected',b.dataset.k===k)});
  $('qwrap').hidden=col().prov!=='sm'; setStatus('');
  const cur=st().cur;
  if(cur&&byId()[cur]) show(cur); else { $('title').firstChild.textContent='Belum ada video dipilih'; $('pos').textContent=''; $('prev').disabled=true; render() }
}
for(const k of KEYS){ const b=document.createElement('button'); b.type='button'; b.dataset.k=k; b.setAttribute('role','tab'); b.textContent=COL[k].name; b.onclick=()=>{ if(k!==pref.col) useCol(k) }; $('cols').appendChild(b) }
$('lock').onclick=()=>{ releaseAll(); try{localStorage.removeItem('furuhonya-key')}catch(e){} location.reload() };
useCol(pref.col);

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pass){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
const gate=document.getElementById('gate'), appEl=document.getElementById('app');
async function unlock(pass,remember){
  const btn=document.getElementById('go'), err=document.getElementById('err');
  btn.disabled=true; err.textContent='Memeriksa…';
  try{
    const data=await decrypt(pass);
    try{ if(remember) localStorage.setItem('furuhonya-key',pass); else localStorage.removeItem('furuhonya-key'); }catch(e){}
    gate.hidden=true; appEl.hidden=false; start(data);
  }catch(e){
    err.textContent='Key salah. Coba lagi.'; btn.disabled=false;
    try{ localStorage.removeItem('furuhonya-key'); }catch(_){}
  }
}
document.getElementById('gateform').addEventListener('submit',e=>{
  e.preventDefault(); unlock(document.getElementById('key').value, document.getElementById('remember').checked);
});
try{ const k=localStorage.getItem('furuhonya-key'); if(k){ document.getElementById('remember').checked=true; unlock(k,true);} }catch(e){}
</script></body></html>
